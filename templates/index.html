<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emotion Detector - Paradise AI</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4ff; margin: 0; }
    .card { max-width: 640px; margin: 60px auto; background: #fff; border-radius: 12px;
            padding: 32px; box-shadow: 0 4px 18px rgba(0,0,0,0.12); text-align: center; }
    h1 { color: #1e3a8a; }
    textarea { width: 92%; height: 90px; font-size: 16px; padding: 10px; border-radius: 8px;
               border: 1px solid #93c5fd; }
    button { background: #2563eb; color: #fff; border: none; padding: 12px 34px; font-size: 17px;
             border-radius: 8px; cursor: pointer; margin-top: 14px; }
    #result { margin-top: 20px; font-size: 18px; color: #111827; background: #eff6ff;
              border-radius: 8px; padding: 16px; min-height: 24px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Emotion Detector</h1>
    <p>Type a sentence and discover its dominant emotion.</p>
    <textarea id="text" placeholder="e.g. I love working with Python"></textarea><br />
    <button onclick="analyze()">Analyze Emotion</button>
    <div id="result"></div>
  </div>
  <script src="/static/mywebscript.js"></script>
</body>
</html>
